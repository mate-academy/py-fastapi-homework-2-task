[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = src/tests
env = ENVIRONMENT=testing
addopts =
    -p no:ament_flake8
    -p no:ament_xmllint
    -p no:ament_pep257
    -p no:ament_copyright
    -p no:ament_lint
    -p no:launch_ros
    -p no:launch_testing_ros
    -p no:launch_testing