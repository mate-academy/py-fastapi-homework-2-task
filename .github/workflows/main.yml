name: CI Pipeline

on:
  pull_request:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Run flake8
        run: |
          poetry run flake8 src

      - name: Run tests
        run: |
          poetry run pytest
