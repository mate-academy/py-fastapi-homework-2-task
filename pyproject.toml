[project]
name = "src"
version = "0.1.0"
description = "Mate task for first lesson"
authors = [
    { name = "Yurii Okal", email = "yurii.okal@mate.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "uvicorn>=0.34.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "ruff>=0.16.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "pytest-env>=1.1.5",
    "flake8>=7.1.1",
    "pytest-asyncio>=0.25.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
