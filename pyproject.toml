[project]
name = "src"
version = "0.1.0"
description = "Mate task for first lesson"
dynamic = ["dependencies"]
authors = [
    { name = "Yurii Okal", email = "yurii.okal@mate.com" }
]
requires-python = ">=3.10,<4.0"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.6"
sqlalchemy = ">=2.0.45,<2.1"
pytest = "^8.3.4"
pydantic = "^2.12.0"
pydantic-settings = "^2.7.0"
pandas = "^2.3.3"
tqdm = "^4.67.1"
uvicorn = "^0.34.0"
httpx = "^0.28.1"
pytest-env = "^1.1.5"
flake8 = "^7.1.1"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
aiosqlite = "^0.21.0"
asyncpg = "^0.30.0"
pytest-asyncio = "^0.25.3"
greenlet = "^3.5.6"
ruff = "^0.17.3"
pydantic-extra-types = "^2.11.1"
pycountry = "^24.6.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
